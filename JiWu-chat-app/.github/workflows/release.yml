name: Build & Release

# 触发条件：
# 1. 推送 v 开头的 tag（如 v1.0.5）时自动构建并上传到对应 Release
# 2. 手动触发：在 Actions 页面选择本 workflow → Run workflow → 输入要补发的版本 tag（如 v1.0.4）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传的版本 tag（如 v1.0.4，注意带 v 前缀）"
        required: true

jobs:
  build-and-release:
    name: Build Windows installers & upload to GitHub Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发：checkout 到用户指定的 tag；push tag 触发：checkout 到当前 tag
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          # 拉取完整历史与 tag，保证能 checkout 到任意历史版本
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder 已配置 --publish never，此处只构建不自动发布，
      # 上传统一交给下方 softprops/action-gh-release，避免 body 被覆盖。
      - name: Build installers
        run: pnpm run electron:build:prod

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发用输入的 tag；push tag 触发用当前 tag 名
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          # 只上传 Windows 安装包；clean-release.js 已清理中间产物，仅保留当前版本 exe
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
