name: Build Desktop Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd JiWu-chat-app && pnpm install --frozen-lockfile
      - name: Generate static dist
        run: cd JiWu-chat-app && pnpm run generate:dist
        env:
          NUXT_PUBLIC_WALLPAPER_BASE: https://jiwuchat.com
      - name: Package with electron-builder (no publish)
        run: cd JiWu-chat-app && pnpm exec electron-builder --win --x64 --publish never
      - run: cd JiWu-chat-app && node scripts/clean-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: JiWu-chat-app/release/*.exe

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd JiWu-chat-app && pnpm install --frozen-lockfile
      - name: Generate static dist
        run: cd JiWu-chat-app && pnpm run generate:dist
        env:
          NUXT_PUBLIC_WALLPAPER_BASE: https://jiwuchat.com
      - name: Package with electron-builder (no publish)
        run: cd JiWu-chat-app && pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
      - run: cd JiWu-chat-app && node scripts/clean-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            JiWu-chat-app/release/*.dmg
            JiWu-chat-app/release/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: cd JiWu-chat-app && pnpm install --frozen-lockfile
      - name: Generate static dist
        run: cd JiWu-chat-app && pnpm run generate:dist
        env:
          NUXT_PUBLIC_WALLPAPER_BASE: https://jiwuchat.com
      - name: Package with electron-builder (no publish)
        run: cd JiWu-chat-app && pnpm exec electron-builder --linux --x64 --publish never
      - run: cd JiWu-chat-app && node scripts/clean-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            JiWu-chat-app/release/*.AppImage
            JiWu-chat-app/release/*.deb
            JiWu-chat-app/release/*.rpm
